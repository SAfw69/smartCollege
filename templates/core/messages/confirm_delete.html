{% extends 'core/base.html' %}
{% block title %}Delete Message{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-6">
  <div class="card border-danger"><div class="card-body text-center p-5">
    <i class="bi bi-trash-fill text-danger fs-1 mb-3 d-block"></i>
    <h4>Delete Message?</h4>
    <p class="text-muted">"{{ message.subject|default:"(No Subject)" }}"</p>
    <div class="d-flex gap-3 justify-content-center mt-4">
      <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger px-4">Delete</button></form>
      <a href="{% url 'message_inbox' %}" class="btn btn-outline-secondary px-4">Cancel</a>
    </div>
  </div></div>
</div></div>
{% endblock %}
