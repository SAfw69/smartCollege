{% extends 'core/base.html' %}
{% block title %}Remove Member{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-6">
  <div class="card">
    <div class="card-body text-center p-5">
      <i class="bi bi-person-dash-fill text-warning fs-1 mb-3 d-block"></i>
      <h4>Remove Member?</h4>
      <p class="text-muted">Remove <strong>{{ member.user.get_full_name|default:member.user.username }}</strong> from <strong>{{ team.team_name }}</strong>?</p>
      <div class="d-flex gap-3 justify-content-center mt-4">
        <form method="post">{% csrf_token %}<button type="submit" class="btn btn-warning px-4">Yes, Remove</button></form>
        <a href="{% url 'team_detail' team.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
      </div>
    </div>
  </div>
</div></div>
{% endblock %}
