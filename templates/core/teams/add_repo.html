{% extends 'core/base.html' %}
{% block title %}Add Repository - {{ team.team_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{% url 'team_detail' team.pk %}">{{ team.team_name }}</a></li><li class="breadcrumb-item active">Add Repository</li></ol></nav>
  <h1>Add Repository</h1>
</div>
<div class="row"><div class="col-md-6">
  <div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label fw-semibold">Repository Name</label>{{ form.name }}</div>
      <div class="mb-3"><label class="form-label fw-semibold">URL</label>{{ form.url }}</div>
      <div class="mb-3"><label class="form-label fw-semibold">Language</label>{{ form.language }}</div>
      <div class="mb-3"><label class="form-label fw-semibold">Description</label>{{ form.description }}</div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-code-square me-1"></i>Add Repository</button>
        <a href="{% url 'team_detail' team.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
