{% extends 'core/base.html' %}
{% block title %}Cancel Meeting{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-6">
  <div class="card border-warning"><div class="card-body text-center p-5">
    <i class="bi bi-calendar-x-fill text-warning fs-1 mb-3 d-block"></i>
    <h4>Cancel Meeting?</h4>
    <p class="text-muted">"{{ meeting.title }}" on {{ meeting.meeting_date|date:"d F Y" }} at {{ meeting.meeting_time|time:"H:i" }}</p>
    <div class="d-flex gap-3 justify-content-center mt-4">
      <form method="post">{% csrf_token %}<button type="submit" class="btn btn-warning px-4">Yes, Cancel It</button></form>
      <a href="{% url 'meeting_detail' meeting.pk %}" class="btn btn-outline-secondary px-4">Keep Meeting</a>
    </div>
  </div></div>
</div></div>
{% endblock %}
